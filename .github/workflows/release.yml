name: Release

on:
  push:
    branches:
      - master
    paths:
      - "packages/mcp-server/**"
      - "packages/lib/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build MCP Server
        run: npm run build -w packages/mcp-server

      - name: Verify packed provenance runtime
        run: node packages/mcp-server/scripts/verify-packed-provenance-runtime.mjs

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./packages/mcp-server/package.json').version")" >> $GITHUB_OUTPUT

      - name: Reject pre-release versions
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [[ "$VERSION" =~ -(alpha|beta|rc)\. ]]; then
            echo "::error::Version '$VERSION' is a pre-release. Use the Beta Release workflow instead."
            exit 1
          fi

      - name: Verify root and package versions are in sync
        run: |
          ROOT=$(node -p "require('./package.json').version")
          PKG=$(node -p "require('./packages/mcp-server/package.json').version")
          ROOT_LOCK=$(node -p "require('./package-lock.json').packages[''].version")
          PKG_LOCK=$(node -p "require('./package-lock.json').packages['packages/mcp-server'].version")
          if [ "$ROOT" != "$PKG" ] || [ "$ROOT" != "$ROOT_LOCK" ] || [ "$ROOT" != "$PKG_LOCK" ]; then
            echo "::error::Version divergence: root=$ROOT, mcp=$PKG, root-lock=$ROOT_LOCK, mcp-lock=$PKG_LOCK. This pipeline publishes off the mcp-server version, so all four values must move in lockstep."
            exit 1
          fi
          echo "Manifest and lockfile versions in sync: $ROOT"

      - name: Verify release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="releases/v${VERSION}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing or empty release notes: $NOTES"
            exit 1
          fi
          echo "Release notes found: $NOTES"

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          if npm view tradeblocks-mcp@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found, will publish"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build MCP Server
        if: steps.check.outputs.exists == 'false'
        run: npm run build -w packages/mcp-server

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.exists == 'false'
        run: |
          npm publish -w packages/mcp-server --access public --provenance
          echo "published=true" >> $GITHUB_OUTPUT

  publish-docker:
    name: Publish Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build MCP Server
        run: npm run build -w packages/mcp-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: packages/mcp-server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradeblocks-mcp:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/tradeblocks-mcp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tradeblocks-mcp:${{ needs.build.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tradeblocks-mcp:latest
          labels: |
            org.opencontainers.image.title=tradeblocks-mcp
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  release:
    name: Create GitHub Release
    needs: [build, publish-npm, publish-docker]
    if: needs.publish-npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          body_path: releases/v${{ needs.build.outputs.version }}.md
